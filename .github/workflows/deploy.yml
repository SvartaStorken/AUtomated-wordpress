name: Bulding and Deploying WordPress with MariaDB

on:
  push:
    branches:
      - test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to redhat registry
        uses: redhat-actions/podman-login@v1.7
        with:
          registry: registry.redhat.io
          username: ${{ secrets.RH_USERNAME }}
          password: ${{ secrets.RH_PASSWORD }}
      
      - name: set up buildah
        uses: redhat-actions/buildah-build@v2.13
        with: 
          image: mariadb
          context: /home/runner/work/AUtomated-wordpress/AUtomated-wordpress/mariadb
          tags: |
            latest
            V1.1
          containerfiles: .Containerfile
