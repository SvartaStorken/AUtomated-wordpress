apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels:
    app: wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          # Här pekar vi på din nya image
          image: ghcr.io/svartastorken/ubi10-wordpress:latest
          imagePullPolicy: Always
          
          # OBS: Detta överskriver CMD i Dockerfilen. 
          # Vi behåller sleep infinity för att kunna testa nätverket manuellt först.
          command: ["sleep", "infinity"]
          
          # HÄR ÄR DET VIKTIGA FÖR DITT KLUSTER:
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
